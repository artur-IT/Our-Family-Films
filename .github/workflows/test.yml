name: Run Tests

# When to run this workflow
on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main ]

# Jobs are tasks that run in parallel or in sequence
jobs:
  test:
    # Run on the latest Ubuntu (Linux) runner
    runs-on: ubuntu-latest

    # Steps are individual actions that run in sequence
    steps:
      # Step 1: Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests
      - name: Run tests
        run: npm test

